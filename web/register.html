<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <meta charset="UTF-8" />
    <link href="Login.css" type="text/css" rel="stylesheet" />
</head>

<body>
    <section>
        <div class="fullpage">

            <div class="parent-main">
                <div class="main">

                    <form action="register.php" method="post">
                        <h1 id="header">
                            Sign in
                        </h1>
                        <div class="input-box">
                            <input type="email" name="email" size="35" required />
                            <label>
                                Email
                            </label>
                        </div>
                        <div class="input-box">
                            <input type="text" name="username" size="35" required />
                            <label>
                                Username
                            </label>
                        </div>

                        <div class="input-box">
                            <input type="password" name="password" required />
                            <label>
                                Password
                            </label>
                        </div>



                        <input type="submit" class="login-btn" name="signin-btn" value="Sign in" />

                        <div class="go-back">
                            <a href="login.html">
                               &larr; Back
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="parent-logo">
                <img src="oven and crumb.svg" class="logo-img" width="500px" />
            </div>

        </div>
    </section>
</body>

</html>
