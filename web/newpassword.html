<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <meta charset="UTF-8" />
    <link href="Login.css" type="text/css" rel="stylesheet" />
</head>

<body>
    <section>
        <div class="fullpage">

            <div class="parent-main">
                <div class="main">

                    <form action="forgpsw.php" method="post">
                        <h1 id="header">
                            Change Password
                        </h1>
						<div class="input-box">
                            <input type="email" name="email" required />
                            <label>
                                Email
                            </label>
                        </div>
                        <div class="input-box">
                            <input type="password" name="newpassword" required />
                            <label>
                                New password
                            </label>
                        </div>

                        <div class="input-box">
                            <input type="password" name="checkpassword" required />
                            <label>
                                Check Password
                            </label>
                        </div>

                        <a href="newpassword.html">
                            <input type="submit" class="login-btn" name="login-btn" value="Login" />
                        </a>

                        <div class="register">
                            <p>
                                Don't have account?
                                <a href="register.html" class="regester">
                                    Regester
                                </a>
                            </p>

                        </div>
                        <div class="go-back">
                            <a href="forgotpassword.html">
                               &larr; Back
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="parent-logo">
                <img src="oven and crumb.svg" class="logo" width="500px" />
            </div>

        </div>
    </section>
</body>

</html>
